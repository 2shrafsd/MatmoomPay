name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  gateway:
    name: Gateway (Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway

    # Production runs on MySQL, so the suite runs against it here.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: matmoom_pay
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Set up the application
        run: composer setup

      - name: Audit dependencies
        run: composer audit && npm audit --omit=dev --audit-level=high

      - name: Formatting and static analysis
        run: |
          vendor/bin/pint --test
          vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Tests against MySQL
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: matmoom_pay
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: php artisan test --compact

  store-web:
    name: Demo store (Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: store-web

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Install
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate

      - name: Tests
        run: php artisan test --compact

  store-mobile:
    name: Mobile app (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: store-mobile

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      # Golden images are recorded on macOS; pixel comparisons are skipped on Linux.
      - run: flutter test --exclude-tags golden
